# Anki Model Definition: Exercise
# Fields match columns from textbook-jones-exercises.csv (excluding Ex/Voc and Note/Warning)
# Arabic fields are marked for RTL display

# Created ID with `import random; random.randrange(1 << 30, 1 << 31)` on 2025-12-16
model_id: 1351566702
name: "Arabic Jones - Exercise"

fields:
  - name: anki-id
    id: 1536763050
  - name: page-number
    id: 1835895167
  - name: lesson-number
    id: 1880749454
  - name: exercise-number
    id: 1795431067
  - name: arabic-text
    rtl: true
    id: 1120026294
  - name: transliteration
    id: 1858420079
  - name: english-text
    id: 1442916767
  - name: quran-surah
    id: 1210284682
  - name: quran-ayah
    id: 1402154580
  - name: usage-notes
    id: 2047863627

css: |
  .card {
    font-family: 'Noto Naskh Arabic', 'Noto Kufi Arabic', 'Amiri', 'Traditional Arabic', serif;
    font-size: 28px;
    text-align: center;
    color: black;
    background-color: white;
    padding: 20px;
  }
  .arabic {
    font-size: 42px;
    direction: rtl;
    unicode-bidi: bidi-override;
    line-height: 1.8;
  }
  .english {
    font-size: 22px;
    margin-top: 15px;
  }
  .notes {
    font-size: 16px;
    font-style: italic;
    margin-top: spx;
  }
  .back-info {
    font-size: 18px;
    text-align: left;
    margin-top: 20px;
  }
  .back-info table {
    margin: 0 auto;
    border-collapse: collapse;
  }
  .back-info td, .back-info th {
    padding: 4px 10px;
    border: 1px solid #ccc;
  }
  .transliteration {
    font-style: italic;
    font-size: 20px;
  }
  .quran-ref {
    font-size: 16px;
    color: #666;
  }
  .audio-container {
    margin: 10px 0;
  }
  .meta {
    font-size: 14px;
    color: #888;
    margin-top: 10px;
  }

# TODO add audio to back too? or does it show up on both sides?
# TODO add link to quran.com? quranWbW? format:
#   for: {{Expression}}, do: <a href="http://example.com/search?q={{Expression}}">check in dictionary</a>
templates:
  - name: "ATtQ Exercise: Arabic → Details"
    id: 1573362606
    qfmt: |
      <div class="arabic">{{arabic-text}}</div>
      {{#audio-front}}
      <div class="audio-container">{{audio-front}}</div>
      {{/audio-front}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="back-info">
        {{#transliteration}}
        <div class="transliteration">{{transliteration}}</div>
        {{/transliteration}}
        <div class="english">{{english-text}}</div>
        <div class="quran-ref">Quran {{quran-surah}}:{{quran-ayah}}</div>

        <div class="meta">
          Lesson {{lesson-number}} | Page {{page-number}} | Exercise {{exercise-number}}
        </div>
      </div>
