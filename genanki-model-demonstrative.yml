# Anki Model Definition: Demonstrative Pronoun/Adjective
# For entries like هٰذَا (this), ذٰلِك (that), etc.

# Created ID with `import random; random.randrange(1 << 30, 1 << 31)` on 2025-12-16
model_id: 1763750158
name: "Arabic Jones - Demonstrative"

fields:
  - name: anki-id
    id: 2066970262
  - name: page-number
    id: 1594343370
  - name: lesson-number
    id: 1412577010
  - name: arabic-word-singular
    rtl: true
    id: 1665883120
  - name: arabic-word-dual
    rtl: true
    id: 1995037549
  - name: arabic-word-plural
    rtl: true
    id: 1901061012
  - name: english-translation
    id: 1749789326
  - name: english-translation-dual
    id: 1800506534
  - name: english-translation-plural
    id: 1485286182
  - name: verb-form
    id: 1310186582
  - name: part-of-speech
    id: 2017143640
  - name: triliteral-root
    id: 1600822142
  - name: usage-notes
    id: 1786119836

css: |
  .card {
    font-family: 'Noto Naskh Arabic', 'Noto Kufi Arabic', 'Amiri', 'Traditional Arabic', serif;
    font-size: 28px;
    text-align: center;
    color: black;
    background-color: white;
    padding: 20px;
  }
  .arabic {
    font-size: 42px;
    direction: rtl;
    unicode-bidi: bidi-override;
    line-height: 1.8;
  }
  .english {
    font-size: 22px;
    margin-top: 15px;
  }
  .notes {
    font-size: 16px;
    font-style: italic;
    margin-top: spx;
  }
  .grammar-label {
    font-size: 16px;
    color: #6a4c93;
    font-style: italic;
    margin-top: 5px;
  }
  table.forms-table {
    margin: 15px auto;
    border-collapse: collapse;
  }
  table.forms-table th {
    font-size: 14px;
    font-weight: normal;
    color: #666;
    padding: 4px 18px;
    border-bottom: 1px solid #ccc;
  }
  table.forms-table td {
    font-size: 28px;
    padding: 8px 18px;
    direction: rtl;
  }
  .meta {
    font-size: 14px;
    color: #888;
    margin-top: 10px;
  }

templates:
  - name: "ATtQ Demonstrative: Singular → Details"
    id: 1777414076
    qfmt: |
      {{#arabic-word-singular}}
      <div class="arabic">{{arabic-word-singular}}</div>
      {{/arabic-word-singular}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{english-translation}}</div>
      {{#usage-notes}}<div class="notes">{{usage-notes}}</div>{{/usage-notes}}
      <div class="grammar-label">{{part-of-speech}}, singular</div>
      <table class="forms-table">
        <tr>
          {{#arabic-word-singular}}<th>Singular</th>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<th>Dual</th>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<th>Plural</th>{{/arabic-word-plural}}
        </tr>
        <tr>
          {{#arabic-word-singular}}<td>{{arabic-word-singular}}</td>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<td>{{arabic-word-dual}}</td>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<td>{{arabic-word-plural}}</td>{{/arabic-word-plural}}
        </tr>
      </table>
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>

  - name: "ATtQ Demonstrative: Plural → Details"
    id: 1105752522
    qfmt: |
      {{#arabic-word-plural}}
      <div class="arabic">{{arabic-word-plural}}</div>
      {{/arabic-word-plural}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{#english-translation-plural}}{{english-translation-plural}}{{/english-translation-plural}}{{^english-translation-plural}}{{english-translation}}{{/english-translation-plural}}</div>
      {{#usage-notes}}<div class="notes">{{usage-notes}}</div>{{/usage-notes}}
      <div class="grammar-label">{{part-of-speech}}, plural</div>
      <table class="forms-table">
        <tr>
          {{#arabic-word-singular}}<th>Singular</th>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<th>Dual</th>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<th>Plural</th>{{/arabic-word-plural}}
        </tr>
        <tr>
          {{#arabic-word-singular}}<td>{{arabic-word-singular}}</td>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<td>{{arabic-word-dual}}</td>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<td>{{arabic-word-plural}}</td>{{/arabic-word-plural}}
        </tr>
      </table>
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>
