css: |
  .card {
    font-family: 'Noto Naskh Arabic', 'Noto Kufi Arabic', 'Amiri', 'Traditional Arabic', serif;
    font-size: 28px;
    text-align: center;
    color: black;
    background-color: white;
    padding: 20px;
  }
  .arabic {
    font-size: 42px;
    direction: rtl;
    unicode-bidi: bidi-override;
    line-height: 1.8;
  }
  .english {
    font-size: 22px;
    margin-top: 15px;
  }
  .notes {
    font-size: 16px;
    font-style: italic;
    margin-top: spx;
  }
  .grammar-label {
    font-size: 16px;
    color: #6a4c93;
    font-style: italic;
    margin-top: 5px;
  }
  table.forms-table {
    margin: 15px auto;
    border-collapse: collapse;
  }
  table.forms-table th {
    font-size: 14px;
    font-weight: normal;
    color: #666;
    padding: 4px 18px;
    border-bottom: 1px solid #ccc;
  }
  table.forms-table td {
    font-size: 28px;
    padding: 8px 18px;
    direction: rtl;
  }
  .meta {
    font-size: 14px;
    color: #888;
    margin-top: 10px;
  }

templates:
  - name: "ATtQ Particle: Arabic → Meaning"
    id: 1712220879
    qfmt: |
      {{#arabic-word-singular}}
      <div class="arabic">{{arabic-word-singular}}</div>
      {{/arabic-word-singular}}
      {{^arabic-word-singular}}
        {{#arabic-word-dual}}
        <div class="arabic">{{arabic-word-dual}}</div>
        {{/arabic-word-dual}}
        {{^arabic-word-dual}}
          {{#arabic-word-plural}}
          <div class="arabic">{{arabic-word-plural}}</div>
          {{/arabic-word-plural}}
        {{/arabic-word-dual}}
      {{/arabic-word-singular}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{english-translation}}</div>
      <div class="grammar-label">{{part-of-speech}}</div>
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>
