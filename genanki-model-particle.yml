# Anki Model Definition: Particle (interrogative, conjunction, etc.)
# For entries like هَلْ, أَ, مَا, مَنْ, etc.

# Created ID with `import random; random.randrange(1 << 30, 1 << 31)` on 2025-12-16
model_id: 1163337782
name: "Arabic Jones - Particle"

fields:
  - name: anki-id
    id: 1877673362
  - name: page-number
    id: 1077632113
  - name: lesson-number
    id: 1214532831
  - name: arabic-word-singular
    rtl: true
    id: 1654351752
  - name: arabic-word-dual
    rtl: true
    id: 2034636086
  - name: arabic-word-plural
    rtl: true
    id: 1753445837
  - name: english-translation
    id: 1351684002
  - name: english-translation-dual
    id: 1682033889
  - name: english-translation-plural
    id: 1816897343
  - name: verb-form
