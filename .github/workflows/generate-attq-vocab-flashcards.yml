name: Generate ATtQ Vocab Flashcards and Create Release

on:
  push:
    branches:
      - main
    paths:
      - 'textbook-jones-vocabulary.csv'

permissions:
  contents: write

jobs:
  generate-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          # Install only the dependencies needed for flashcard generation
          pip install genanki PyYAML
      
      - name: Get commit hashes of input files
        id: get_commits
        run: |
          VOCAB_COMMIT=$(git log -1 --format="%H" -- textbook-jones-vocabulary.csv)
          echo "vocab_commit=$VOCAB_COMMIT" >> $GITHUB_OUTPUT
          echo "vocab_short=$(echo $VOCAB_COMMIT | cut -c1-7)" >> $GITHUB_OUTPUT
      
      - name: Generate Vocabulary Anki deck, csv_min, csv_med, csv_max
        run: |
          python3 arabic-textbook-to-flashcards.py \
            --format anki csv_min csv_med csv_max \
            --output attq-vocab-deck.apkg \
            --deck-name "Arabic Through the Qur'an" \
            textbook-jones-vocabulary.csv
      
      - name: Create release tag
        id: create_tag
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          TAG_NAME="attq-flashcards-$TIMESTAMP"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
      
      - name: Create release notes
        id: release_notes
        run: |
          cat << EOF > release_notes.md
          ## Arabic Vocab Flashcards Release
          
          Generated on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ### Input Files Used
          
          - **Vocabulary CSV**: 
          [\`textbook-jones-vocabulary.csv\`](https://github.com/${{ github.repository }}/blob/${{ steps.get_commits.outputs.vocab_commit }}/textbook-jones-vocabulary.csv) 
          (commit [${{ steps.get_commits.outputs.vocab_short }}](https://github.com/${{ github.repository }}/commit/${{ steps.get_commits.outputs.vocab_commit }}))

          ### Release Assets
          
          - **attq-vocab-deck.apkg** - Anki deck with all vocabulary and exercises
          - The following two-column CSV format for import into other flashcard applications:
            - **attq-vocab-deck-min.csv** - the arabic word is in the first column. The english translation is in the second column.
            - **attq-vocab-deck-med.csv** - the arabic word is in the first column. The english translation and the part of speech are in the second column.
            - **attq-vocab-deck-max.csv** - the arabic word is in the first column.  The english translation, the part of speech, the page number, lesson number, the verb form (if provided), the triliteral root, and any usage notes concatenated together are in the second column.

          ### What's Included
          
          This release contains flashcards generated from the vocabulary in "Arabic Through the Qur'an" by Alan Jones. 
          The Anki deck includes:
          - Vocabulary items organized by lesson and part of speech
          - Multiple card templates for different word forms (singular/dual/plural for nouns, perfect/imperfect/verbal noun for verbs)
          
          The CSV file provides a simple two-column format (Front, Back) suitable for importing into various flashcard applications.
          EOF
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8  # v2.2.0
        with:
          tag_name: ${{ steps.create_tag.outputs.tag_name }}
          name: Arabic Through the Qur'an Vocab Flashcards ${{ steps.create_tag.outputs.timestamp }}
          body_path: release_notes.md
          files: |
            attq-vocab-deck.apkg
            attq-vocab-deck-min.csv
            attq-vocab-deck-med.csv
            attq-vocab-deck-max.csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
