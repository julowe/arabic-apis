# Anki Model Definition: Other (fallback for demonstrative pronouns, particles, interrogatives, etc.)
# Fields match columns from textbook-jones-vocabulary.csv
# There should only be one Arabic column of text, but leaving other columns in case data gets entered there
# Excludes Ex/Voc and Note/Warning
# Arabic fields are marked for RTL display

# Created ID with `import random; random.randrange(1 << 30, 1 << 31)` on 2025-12-16
model_id: 1807197556
name: "Arabic Jones - Other"

fields:
  - name: anki-id
  - name: page-number
  - name: lesson-number
  - {name: arabic-word-singular, rtl: true}
  - {name: arabic-word-dual, rtl: true}
  - {name: arabic-word-plural, rtl: true}
  - name: english-translation
  - name: verb-form
  - name: part-of-speech
  - name: triliteral-root
  - name: usage-notes

css: |
  .card {
    font-family: 'Noto Naskh Arabic', 'Noto Kufi Arabic', 'Amiri', 'Traditional Arabic', serif;
    font-size: 28px;
    text-align: center;
    color: black;
    background-color: white;
    padding: 20px;
  }
  .arabic {
    font-size: 42px;
    direction: rtl;
    unicode-bidi: bidi-override;
    line-height: 1.8;
  }
  .english {
    font-size: 22px;
    margin-top: 15px;
  }
  .grammar-label {
    font-size: 16px;
    color: #6a4c93;
    font-style: italic;
    margin-top: 5px;
  }
  table.forms-table {
    margin: 15px auto;
    border-collapse: collapse;
  }
  table.forms-table th {
    font-size: 14px;
    font-weight: normal;
    color: #666;
    padding: 4px 18px;
    border-bottom: 1px solid #ccc;
  }
  table.forms-table td {
    font-size: 28px;
    padding: 8px 18px;
    direction: rtl;
  }
  .meta {
    font-size: 14px;
    color: #888;
    margin-top: 10px;
  }

templates:
  # Card 1: Primary form front (singular/first entry if not empty)
  - name: "ATtQ Other: Primary Form → Details"
    qfmt: |
      {{#arabic-word-singular}}
      <div class="arabic">{{arabic-word-singular}}</div>
      {{/arabic-word-singular}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{english-translation}}</div>
      {{#usage-notes}}<div class="notes">{{usage-notes}}</div>{{/usage-notes}}
      <div class="grammar-label">{{part-of-speech}}</div>
      {{#arabic-word-dual}}
      <table class="forms-table">
        <tr>
          {{#arabic-word-singular}}<th>Primary</th>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<th>Alternate</th>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<th>Plural</th>{{/arabic-word-plural}}
        </tr>
        <tr>
          {{#arabic-word-singular}}<td>{{arabic-word-singular}}</td>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<td>{{arabic-word-dual}}</td>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<td>{{arabic-word-plural}}</td>{{/arabic-word-plural}}
        </tr>
      </table>
      {{/arabic-word-dual}}
      {{^arabic-word-dual}}
      {{#arabic-word-plural}}
      <table class="forms-table">
        <tr>
          {{#arabic-word-singular}}<th>Primary</th>{{/arabic-word-singular}}
          {{#arabic-word-plural}}<th>Plural</th>{{/arabic-word-plural}}
        </tr>
        <tr>
          {{#arabic-word-singular}}<td>{{arabic-word-singular}}</td>{{/arabic-word-singular}}
          {{#arabic-word-plural}}<td>{{arabic-word-plural}}</td>{{/arabic-word-plural}}
        </tr>
      </table>
      {{/arabic-word-plural}}
      {{/arabic-word-dual}}
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>

  # Card 2: Alternate form front (dual if not empty, and different from singular)
  - name: "ATtQ Other: Dual Form → Details"
    qfmt: |
      {{#arabic-word-dual}}
      <div class="arabic">{{arabic-word-dual}}</div>
      {{/arabic-word-dual}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{english-translation}}</div>
      {{#usage-notes}}<div class="notes">{{usage-notes}}</div>{{/usage-notes}}
      <div class="grammar-label">{{part-of-speech}}</div>
      <table class="forms-table">
        <tr>
          {{#arabic-word-singular}}<th>Primary</th>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<th>Alternate</th>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<th>Plural</th>{{/arabic-word-plural}}
        </tr>
        <tr>
          {{#arabic-word-singular}}<td>{{arabic-word-singular}}</td>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<td>{{arabic-word-dual}}</td>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<td>{{arabic-word-plural}}</td>{{/arabic-word-plural}}
        </tr>
      </table>
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>

  # Card 3: Plural form front (if not empty)
  - name: "ATtQ Other: Plural Form → Details"
    qfmt: |
      {{#arabic-word-plural}}
      <div class="arabic">{{arabic-word-plural}}</div>
      {{/arabic-word-plural}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{english-translation}}</div>
      {{#usage-notes}}<div class="notes">{{usage-notes}}</div>{{/usage-notes}}
      <div class="grammar-label">{{part-of-speech}}</div>
      <table class="forms-table">
        <tr>
          {{#arabic-word-singular}}<th>Primary</th>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<th>Alternate</th>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<th>Plural</th>{{/arabic-word-plural}}
        </tr>
        <tr>
          {{#arabic-word-singular}}<td>{{arabic-word-singular}}</td>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<td>{{arabic-word-dual}}</td>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<td>{{arabic-word-plural}}</td>{{/arabic-word-plural}}
        </tr>
      </table>
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>

