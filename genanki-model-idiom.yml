# Anki Model Definition: Idiom
# For idiomatic expressions like مَا أَدْرَاكَ, طَابَ نَفْسًا, etc.

# Created ID with `import random; random.randrange(1 << 30, 1 << 31)` on 2025-12-16
model_id: 1635153256
name: "Arabic Jones - Idiom"

# Note: Idiom entries should only have the 'singular' column filled in,
#       but dual and plural fields are included just in case data gets entered there.
fields:
  - name: anki-id
  - name: page-number
  - name: lesson-number
  - {name: arabic-word-singular, rtl: true}
  - {name: arabic-word-dual, rtl: true}
  - {name: arabic-word-plural, rtl: true}
  - name: english-translation-singular
  - name: english-translation-dual
  - name: english-translation-plural
  - name: verb-form
  - name: part-of-speech
  - name: triliteral-root
  - name: usage-notes

css: |
  .card {
    font-family: 'Noto Naskh Arabic', 'Noto Kufi Arabic', 'Amiri', 'Traditional Arabic', serif;
    font-size: 28px;
    text-align: center;
    color: black;
    background-color: white;
    padding: 20px;
  }
  .arabic {
    font-size: 42px;
    direction: rtl;
    unicode-bidi: bidi-override;
    line-height: 1.8;
  }
  .english {
    font-size: 22px;
    margin-top: 15px;
  }
  .grammar-label {
    font-size: 16px;
    color: #6a4c93;
    font-style: italic;
    margin-top: 5px;
  }
  table.forms-table {
    margin: 15px auto;
    border-collapse: collapse;
  }
  table.forms-table th {
    font-size: 14px;
    font-weight: normal;
    color: #666;
    padding: 4px 18px;
    border-bottom: 1px solid #ccc;
  }
  table.forms-table td {
    font-size: 28px;
    padding: 8px 18px;
    direction: rtl;
  }
  .meta {
    font-size: 14px;
    color: #888;
    margin-top: 10px;
  }

templates:
  - name: "ATtQ Idiom: Arabic → Meaning"
    qfmt: |
      {{#arabic-word-singular}}
      <div class="arabic">{{arabic-word-singular}}</div>
      {{/arabic-word-singular}}
      {{^arabic-word-singular}}
        {{#arabic-word-dual}}
        <div class="arabic">{{arabic-word-dual}}</div>
        {{/arabic-word-dual}}
        {{#arabic-word-plural}}
        <div class="arabic">{{arabic-word-plural}}</div>
        {{/arabic-word-plural}}
      {{/arabic-word-singular}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{english-translation-singular}}</div>
      {{#usage-notes}}<div class="notes">{{usage-notes}}</div>{{/usage-notes}}
      <div class="grammar-label">{{part-of-speech}}</div>
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>

