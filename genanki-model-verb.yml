# Anki Model Definition: Verb
# Fields match columns from textbook-jones-vocabulary.csv for verb entries
# Excludes Ex/Voc and Note/Warning
# Arabic fields are marked for RTL display
# For verbs: Sing./Perf. = Perfect tense, Dual/Imperf. = Imperfect tense, Plural/Verbal N. = Verbal Noun
# Maybe at some point reflect that this is الفِعْلُ the verb part of speech

# Created ID with `import random; random.randrange(1 << 30, 1 << 31)` on 2025-12-16
model_id: 1394306613
name: "Arabic Jones - Verb"

fields:
  - name: anki-id
  - name: page-number
  - name: lesson-number
  - {name: arabic-verb-perfect, rtl: true }
  - {name: arabic-verb-imperfect, rtl: true }
  - {name: arabic-verbal-noun, rtl: true }
  - name: english-translation-singular
  - name: english-translation-dual
  - name: english-translation-plural
  - name: verb-form
  - name: part-of-speech
  - name: triliteral-root
  - name: usage-notes


css: |
  .card {
    font-family: 'Noto Naskh Arabic', 'Noto Kufi Arabic', 'Amiri', 'Traditional Arabic', serif;
    font-size: 28px;
    text-align: center;
    color: black;
    background-color: white;
    padding: 20px;
  }
  .arabic {
    font-size: 42px;
    direction: rtl;
    unicode-bidi: bidi-override;
    line-height: 1.8;
  }
  .english {
    font-size: 22px;
    margin-top: 15px;
  }
  .grammar-label {
    font-size: 16px;
    color: #6a4c93;
    font-style: italic;
    margin-top: 5px;
  }
  table.forms-table {
    margin: 15px auto;
    border-collapse: collapse;
  }
  table.forms-table th {
    font-size: 14px;
    font-weight: normal;
    color: #666;
    padding: 4px 18px;
    border-bottom: 1px solid #ccc;
  }
  table.forms-table td {
    font-size: 28px;
    padding: 8px 18px;
    direction: rtl;
  }
  .verb-form {
    font-size: 16px;
    color: #4a90a4;
    margin-top: 8px;
  }
  .meta {
    font-size: 14px;
    color: #888;
    margin-top: 10px;
  }

templates:
  # Card 1: Perfect tense front (if not empty)
  - name: "ATtQ Verb: Perfect → Details"
    qfmt: |
      {{#arabic-verb-perfect}}
      <div class="arabic">{{arabic-verb-perfect}}</div>
      {{/arabic-verb-perfect}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{english-translation-singular}}</div>
      {{#usage-notes}}<div class="notes">{{usage-notes}}</div>{{/usage-notes}}
      <div class="grammar-label">
        {{part-of-speech}}, perfect
        {{#verb-form}}
        <span class="verb-form">, Form {{verb-form}}</span>
        {{/verb-form}}
      </div>
      <table class="forms-table">
        <tr>
          {{#arabic-verb-perfect}}<th>Perfect</th>{{/arabic-verb-perfect}}
          {{#arabic-verb-imperfect}}<th>Imperfect</th>{{/arabic-verb-imperfect}}
          {{#arabic-verbal-noun}}<th>Verbal Noun</th>{{/arabic-verbal-noun}}
        </tr>
        <tr>
          {{#arabic-verb-perfect}}<td>{{arabic-verb-perfect}}</td>{{/arabic-verb-perfect}}
          {{#arabic-verb-imperfect}}<td>{{arabic-verb-imperfect}}</td>{{/arabic-verb-imperfect}}
          {{#arabic-verbal-noun}}<td>{{arabic-verbal-noun}}</td>{{/arabic-verbal-noun}}
        </tr>
      </table>
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>

  # Card 2: Imperfect tense front (if not empty)
  - name: "ATtQ Verb: Imperfect → Details"
    qfmt: |
      {{#arabic-verb-imperfect}}
      <div class="arabic">{{arabic-verb-imperfect}}</div>
      {{/arabic-verb-imperfect}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{#english-translation-dual}}{{english-translation-dual}}{{/english-translation-dual}}{{^english-translation-dual}}{{english-translation-singular}}{{/english-translation-dual}}</div>
      {{#usage-notes}}<div class="notes">{{usage-notes}}</div>{{/usage-notes}}
      <div class="grammar-label">
        {{part-of-speech}}, imperfect
        {{#verb-form}}
        <span class="verb-form">, Form {{verb-form}}</span>
        {{/verb-form}}
      </div>
      <table class="forms-table">
        <tr>
          {{#arabic-verb-perfect}}<th>Perfect</th>{{/arabic-verb-perfect}}
          {{#arabic-verb-imperfect}}<th>Imperfect</th>{{/arabic-verb-imperfect}}
          {{#arabic-verbal-noun}}<th>Verbal Noun</th>{{/arabic-verbal-noun}}
        </tr>
        <tr>
          {{#arabic-verb-perfect}}<td>{{arabic-verb-perfect}}</td>{{/arabic-verb-perfect}}
          {{#arabic-verb-imperfect}}<td>{{arabic-verb-imperfect}}</td>{{/arabic-verb-imperfect}}
          {{#arabic-verbal-noun}}<td>{{arabic-verbal-noun}}</td>{{/arabic-verbal-noun}}
        </tr>
      </table>
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>

  # Card 3: Verbal noun front (if not empty)
  - name: "ATtQ Verb: Verbal Noun → Details"
    qfmt: |
      {{#arabic-verbal-noun}}
      <div class="arabic">{{arabic-verbal-noun}}</div>
      {{/arabic-verbal-noun}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{#english-translation-plural}}{{english-translation-plural}}{{/english-translation-plural}}{{^english-translation-plural}}{{english-translation-singular}}{{/english-translation-plural}}</div>
      {{#usage-notes}}<div class="notes">{{usage-notes}}</div>{{/usage-notes}}
      <div class="grammar-label">
        {{part-of-speech}}, verbal noun
        {{#verb-form}}
        <span class="verb-form">, Form {{verb-form}}</span>
        {{/verb-form}}
      </div>
      <table class="forms-table">
        <tr>
          {{#arabic-verb-perfect}}<th>Perfect</th>{{/arabic-verb-perfect}}
          {{#arabic-verb-imperfect}}<th>Imperfect</th>{{/arabic-verb-imperfect}}
          {{#arabic-verbal-noun}}<th>Verbal Noun</th>{{/arabic-verbal-noun}}
        </tr>
        <tr>
          {{#arabic-verb-perfect}}<td>{{arabic-verb-perfect}}</td>{{/arabic-verb-perfect}}
          {{#arabic-verb-imperfect}}<td>{{arabic-verb-imperfect}}</td>{{/arabic-verb-imperfect}}
          {{#arabic-verbal-noun}}<td>{{arabic-verbal-noun}}</td>{{/arabic-verbal-noun}}
        </tr>
      </table>
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>

