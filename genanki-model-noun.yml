# Anki Model Definition: Noun
# Fields match columns from textbook-jones-vocabulary.csv for noun entries
# Excludes Ex/Voc and Note/Warning
# Arabic fields are marked for RTL display
# Maybe at some point reflect that this is الاِسْمُ
#   the ~name/noun part of speech, larger that English's noun category

# Created ID with `import random; random.randrange(1 << 30, 1 << 31)` on 2025-12-16
model_id: 1854973626
name: "Arabic Jones - Noun"

#    fields=[
#    {
#      'name': 'Question',
#      # Optional properties have defaults in the code:
#      # 'font': 'Liberation Sans',
#      # 'size': 20,
#      # 'rtl': False,
#      # 'sticky': False
#    },
#  {
#    'name': 'Answer',
#  },
#]

#  - [name: arabic-word-singular, rtl: true]

# TODO add trilateral root field
# TODO set font and size in note model? or just leave in CSS so anki has another normal-ish font fallback?
# TODO set font to percentage (and would it then inherit from anki settings?), or use viewport units?
#    https://www.w3schools.com/css/css_font_size.asp
# TODO add gender column to CSV and then to cards?

# NOTE: anki-id is first so that Anki defaults to using it as the sort field
fields:
  - name: anki-id
    id: 1228695332
  - name: page-number
    id: 1712983032
  - name: lesson-number
    id: 1686847651
  - name: arabic-word-singular
    rtl: true
    id: 1501661569
  - name: arabic-word-dual
    rtl: true
    id: 2136575159
  - name: arabic-word-plural
    rtl: true
    id: 1676232208
  - name: english-translation
    id: 1129041858
  - name: english-translation-dual
    id: 1978548439
  - name: english-translation-plural
    id: 1434682519
  - name: verb-form
    id: 2124028107
  - name: part-of-speech
    id: 1600635411
  - name: triliteral-root
    id: 1455624241
  - name: usage-notes
    id: 1642691299

css: |
  .card {
    font-family: 'Noto Naskh Arabic', 'Noto Kufi Arabic', 'Amiri', 'Traditional Arabic', serif;
    font-size: 28px;
    text-align: center;
    color: black;
    background-color: white;
    padding: 20px;
  }
  .arabic {
    font-size: 42px;
    direction: rtl;
    unicode-bidi: bidi-override;
    line-height: 1.8;
  }
  .english {
    font-size: 22px;
    margin-top: 15px;
  }
  .grammar-label {
    font-size: 16px;
    color: #6a4c93;
    font-style: italic;
    margin-top: 5px;
  }
  table.forms-table {
    margin: 15px auto;
    border-collapse: collapse;
  }
  table.forms-table th {
    font-size: 14px;
    font-weight: normal;
    color: #666;
    padding: 4px 18px;
    border-bottom: 1px solid #ccc;
  }
  table.forms-table td {
    font-size: 28px;
    padding: 8px 18px;
    direction: rtl;
  }
  .meta {
    font-size: 14px;
    color: #888;
    margin-top: 10px;
  }

templates:
  # Card 1: Singular form front (if not empty)
  - name: "ATtQ Noun: Singular → Details"
    qfmt: |
      {{#arabic-word-singular}}
      <div class="arabic">{{arabic-word-singular}}</div>
      {{/arabic-word-singular}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{english-translation}}</div>
      {{#usage-notes}}<div class="notes">{{usage-notes}}</div>{{/usage-notes}}
      <div class="grammar-label">{{part-of-speech}}, singular</div>
      <table class="forms-table">
        <tr>
          {{#arabic-word-singular}}<th>Singular</th>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<th>Dual</th>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<th>Plural</th>{{/arabic-word-plural}}
        </tr>
        <tr>
          {{#arabic-word-singular}}<td>{{arabic-word-singular}}</td>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<td>{{arabic-word-dual}}</td>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<td>{{arabic-word-plural}}</td>{{/arabic-word-plural}}
        </tr>
      </table>
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>

  # Card 2: Dual form front (if not empty)
  - name: "ATtQ Noun: Dual → Details"
    qfmt: |
      {{#arabic-word-dual}}
      <div class="arabic">{{arabic-word-dual}}</div>
      {{/arabic-word-dual}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{#english-translation-dual}}{{english-translation-dual}}{{/english-translation-dual}}{{^english-translation-dual}}{{english-translation}}{{/english-translation-dual}}</div>
      {{#usage-notes}}<div class="notes">{{usage-notes}}</div>{{/usage-notes}}
      <div class="grammar-label">{{part-of-speech}}, dual</div>
      <table class="forms-table">
        <tr>
          {{#arabic-word-singular}}<th>Singular</th>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<th>Dual</th>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<th>Plural</th>{{/arabic-word-plural}}
        </tr>
        <tr>
          {{#arabic-word-singular}}<td>{{arabic-word-singular}}</td>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<td>{{arabic-word-dual}}</td>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<td>{{arabic-word-plural}}</td>{{/arabic-word-plural}}
        </tr>
      </table>
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>

  # Card 3: Plural form front (if not empty)
  - name: "ATtQ Noun: Plural → Details"
    qfmt: |
      {{#arabic-word-plural}}
      <div class="arabic">{{arabic-word-plural}}</div>
      {{/arabic-word-plural}}
    afmt: |
      {{FrontSide}}
      <hr id="answer">
      <div class="english">{{#english-translation-plural}}{{english-translation-plural}}{{/english-translation-plural}}{{^english-translation-plural}}{{english-translation}}{{/english-translation-plural}}</div>
      {{#usage-notes}}<div class="notes">{{usage-notes}}</div>{{/usage-notes}}
      <div class="grammar-label">{{part-of-speech}}, plural</div>
      <table class="forms-table">
        <tr>
          {{#arabic-word-singular}}<th>Singular</th>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<th>Dual</th>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<th>Plural</th>{{/arabic-word-plural}}
        </tr>
        <tr>
          {{#arabic-word-singular}}<td>{{arabic-word-singular}}</td>{{/arabic-word-singular}}
          {{#arabic-word-dual}}<td>{{arabic-word-dual}}</td>{{/arabic-word-dual}}
          {{#arabic-word-plural}}<td>{{arabic-word-plural}}</td>{{/arabic-word-plural}}
        </tr>
      </table>
      <div class="meta">
        Lesson {{lesson-number}} | Page {{page-number}}
      </div>
